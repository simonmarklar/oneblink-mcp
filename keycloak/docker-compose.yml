# Keycloak + Postgres for the OneBlink MCP OAuth PoC.
#
# Persistent: realm, users, and the mappers survive `down`/`up` because they
# live in the Postgres volume (unlike `start-dev`, which is in-memory).
#
# Two ways to get the realm populated:
#   1. First run with no realm file: configure it once in the UI (guide Steps
#      2-6), then export it (see keycloak/README.md) so it's reproducible.
#   2. Drop a realm export at keycloak/realm-export.json and it is auto-imported
#      on a fresh volume (the --import-realm flag below).
#
# Still a PoC, not production: default admin creds, HTTP only, dev-friendly.
services:
  postgres:
    image: postgres:16-alpine
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keycloak']
      interval: 5s
      timeout: 5s
      retries: 10
    # No ports published — only Keycloak needs it, on the internal network.

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HEALTH_ENABLED: 'true'
      # Pin the hostname so issued tokens always carry
      #   iss = http://localhost:8080/realms/oneblink-poc
      # regardless of whether they were obtained via the host (browser/curl) or
      # reached over the compose network. This keeps the server's issuer check
      # stable. See the issuer note in keycloak/README.md.
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
    ports:
      - '127.0.0.1:8080:8080' # loopback-only, matches the PoC posture
    volumes:
      # Auto-import a realm export if present (ignored if the dir is empty).
      - ./import:/opt/keycloak/data/import:ro
    healthcheck:
      test: ['CMD-SHELL', "exec 3<>/dev/tcp/localhost/8080 && echo done >&3"]
      interval: 10s
      timeout: 5s
      retries: 15
    depends_on:
      postgres:
        condition: service_healthy

  oneblink-mcp:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: oneblink-mcp
    environment:
      HTTP_BIND: 0.0.0.0 # inside the container; only published to host loopback
      HTTP_PORT: 3000
      # Externally-reachable URL the host client uses (NOT the 0.0.0.0 bind).
      # Advertised in RFC 9728 metadata + WWW-Authenticate resource_metadata.
      HTTP_PUBLIC_URL: http://127.0.0.1:3000
      # iss the token carries (what the browser/curl used): localhost.
      HTTP_OAUTH_ISSUER: http://localhost:8080/realms/oneblink-poc
      # JWKS fetched over the compose network: service DNS name, not localhost.
      HTTP_OAUTH_JWKS_URI: http://keycloak:8080/realms/oneblink-poc/protocol/openid-connect/certs
      HTTP_OAUTH_AUDIENCE: oneblink-mcp
      HTTP_KEY_FILE: /run/secrets/oneblink-keys.json
    ports:
      - '127.0.0.1:3000:3000' # host reaches the server at 127.0.0.1:3000
    volumes:
      # OneBlink keys mounted read-only. Create ../oneblink-keys.local.json
      # first (copy the .example). Never baked into the image.
      - ../oneblink-keys.local.json:/run/secrets/oneblink-keys.json:ro
    depends_on:
      keycloak:
        condition: service_healthy

volumes:
  keycloak-db-data:
